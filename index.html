@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#07120D; --panel:#0E1F17; --panel2:#15291F; --line:#20362B;
  --text:#E7F2EB; --muted:#7C978A;
  --emerald:#2FE0B0; --leaf:#8ED164; --deep:#064E3B;
  --gold:#F2B441; --danger:#F0603E; --accent:#2FE0B0;
}
html,body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;}
.wrap{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
  background:radial-gradient(130% 55% at 50% -12%, #0c3b2b88 0%, transparent 60%), var(--bg);}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(16px + env(safe-area-inset-top)) 18px 10px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,var(--emerald),var(--deep));display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 0 16px -2px var(--emerald);}
.brand h1{font-family:'Space Grotesk';font-size:20px;font-weight:700;letter-spacing:.02em;}
.brand small{color:var(--muted);font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;display:block;margin-top:-2px;}
.hbtns{display:flex;align-items:center;gap:8px;}
.veh-pill{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);padding:6px 11px 6px 7px;border-radius:999px;font-size:12.5px;font-weight:600;max-width:150px;cursor:pointer;}
.veh-pill .av{width:22px;height:22px;border-radius:50%;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:14px;overflow:hidden;flex:none;}
.veh-pill .av img{width:100%;height:100%;object-fit:cover;}
.veh-pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.gear{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;}
main{flex:1;padding:6px 16px 100px;}
.section-t{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:22px 4px 10px;font-weight:600;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;}
.card+.card{margin-top:12px;}
.dial-card{display:flex;flex-direction:column;align-items:center;padding:20px 16px 18px;background:linear-gradient(180deg,var(--panel) 0%, #0b1a13 100%);}
.tag{font-size:10px;color:var(--muted);letter-spacing:.16em;text-transform:uppercase;font-weight:600;margin-bottom:8px;}
.dial{position:relative;width:236px;height:236px;}
.dial .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.dial .big{font-family:'JetBrains Mono';font-size:47px;font-weight:700;line-height:1;letter-spacing:-.02em;}
.dial .unit{font-size:11px;color:var(--muted);letter-spacing:.22em;margin-top:6px;text-transform:uppercase;}
.dial .sub{font-size:12.5px;color:var(--muted);margin-top:10px;text-align:center;padding:0 12px;}
.dial .sub b{color:var(--accent);font-family:'JetBrains Mono';}
.fill-loc{font-size:12.5px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:6px;}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:none;border-radius:14px;padding:15px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:filter .15s,transform .05s;}
.btn:active{transform:scale(.985);}
.btn-go{background:var(--accent);color:#04140d;}
.btn-go:hover{filter:brightness(1.07);}
.btn-warn{background:var(--gold);color:#241a02;}
.btn-stop{background:var(--danger);color:#fff;}
.btn-ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line);}
.btn-row{display:flex;gap:10px;margin-top:12px;}
.btn-sm{padding:12px;font-size:13.5px;border-radius:12px;}
.timer{text-align:center;padding:10px 0 6px;}
.timer .t{font-family:'JetBrains Mono';font-size:38px;font-weight:700;letter-spacing:.02em;}
.timer .lbl{color:var(--muted);font-size:10px;letter-spacing:.2em;text-transform:uppercase;}
.timer .sub2{color:var(--muted);font-size:12.5px;margin-top:6px;}
.timer .sub2 b{color:var(--text);font-family:'JetBrains Mono';}
.gps-line{font-size:11.5px;color:var(--emerald);margin-top:4px;font-family:'JetBrains Mono';}
.gps-err{font-size:11.5px;color:var(--gold);margin-top:4px;}
.paused-flag{display:inline-flex;align-items:center;gap:6px;background:#f2b4411a;color:var(--gold);font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;margin-bottom:8px;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 12px;}
.stat .v{font-family:'JetBrains Mono';font-size:20px;font-weight:700;}
.stat .k{font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:3px;}
.eff-row{display:flex;gap:10px;margin-top:12px;}
.eff{flex:1;background:var(--panel2);border-radius:12px;padding:11px 13px;}
.eff .v{font-family:'JetBrains Mono';font-weight:700;font-size:16px;color:var(--accent);}
.eff .k{font-size:10.5px;color:var(--muted);margin-top:2px;}
.node{display:flex;gap:13px;}
.node .rail{display:flex;flex-direction:column;align-items:center;width:26px;flex:none;}
.marker{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--panel2);border:1.5px solid var(--line);flex:none;font-size:12px;}
.marker.start{border-color:var(--accent);color:var(--accent);}
.marker.stop{border-color:var(--gold);}
.marker.dest{border-color:var(--text);}
.rail .line{width:2px;flex:1;min-height:22px;background:var(--line);margin:2px 0;}
.node .body{padding-bottom:15px;flex:1;min-width:0;}
.node .place{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.node .place a{color:inherit;text-decoration:none;}
.node .meta{font-size:11.5px;color:var(--muted);margin-top:2px;}
.node .leg{font-family:'JetBrains Mono';font-size:12px;color:var(--accent);margin-top:5px;}
.sess-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;}
.sess-total{font-family:'JetBrains Mono';font-size:26px;font-weight:700;}
.sess-total small{font-size:13px;color:var(--muted);font-weight:500;}
.bar{height:7px;border-radius:4px;background:var(--panel2);overflow:hidden;margin-top:10px;}
.bar i{display:block;height:100%;border-radius:4px;transition:width .5s;}
.open-tag{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border-radius:999px;padding:6px 11px;font-size:11.5px;color:var(--muted);font-weight:500;}
.chip b{color:var(--text);font-family:'JetBrains Mono';}
.mapwrap{margin-top:12px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--panel2);}
.mapwrap iframe{width:100%;height:170px;border:0;display:block;filter:saturate(.85);}
.maplink{display:flex;align-items:center;justify-content:center;gap:7px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13.5px;font-weight:600;color:var(--emerald);text-decoration:none;margin-top:10px;}
.vrow{display:flex;align-items:center;gap:12px;}
.vrow .ic{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--panel2);flex:none;font-size:24px;overflow:hidden;}
.vrow .ic img{width:100%;height:100%;object-fit:cover;}
.vrow .info{flex:1;min-width:0;cursor:pointer;}
.vrow .info .n{font-weight:600;font-size:15px;}
.vrow .info .d{font-size:12px;color:var(--muted);margin-top:2px;}
.vrow .act{display:flex;gap:6px;}
.iconbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;}
.iconbtn:hover{color:var(--text);}
.active-mark{font-size:9.5px;font-weight:700;letter-spacing:.1em;border:1px solid var(--accent);color:var(--accent);border-radius:6px;padding:4px 6px;}
.empty{text-align:center;padding:34px 20px;color:var(--muted);}
.empty .ico{font-size:34px;opacity:.6;margin-bottom:10px;}
.empty p{font-size:14px;line-height:1.5;max-width:270px;margin:0 auto;}
nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);background:#091510ee;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);}
nav button{font-size:10px !important;}
nav button{background:none;border:none;color:var(--muted);padding:11px 0 13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:inherit;font-size:10.5px;font-weight:500;}
nav button.on{color:var(--accent);}
nav button svg{width:21px;height:21px;}
.svg-i{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.overlay{position:fixed;inset:0;background:#030806cc;display:flex;align-items:flex-end;justify-content:center;z-index:50;}
.sheet{background:var(--panel);width:100%;max-width:480px;border-radius:22px 22px 0 0;border-top:1px solid var(--line);padding:20px 18px calc(24px + env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto;animation:up .22s ease;}
@keyframes up{from{transform:translateY(28px);opacity:.6;}to{transform:translateY(0);opacity:1;}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.sheet-h h3{font-family:'Space Grotesk';font-size:18px;font-weight:600;}
.field{margin-bottom:13px;}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:500;}
.field input,.field textarea,.field select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:13px;color:var(--text);font-size:15px;font-family:inherit;}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent);}
.field.mono input{font-family:'JetBrains Mono';}
.seg{display:flex;gap:8px;}
.seg button{flex:1;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--muted);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;}
.seg button.on-ev{border-color:var(--emerald);color:var(--emerald);background:#2fe0b016;}
.seg button.on-ice{border-color:var(--leaf);color:var(--leaf);background:#8ed16416;}
.seg button.on{border-color:var(--accent);color:var(--accent);background:#2fe0b016;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.hint{font-size:11.5px;color:var(--muted);margin:-4px 0 13px;line-height:1.45;}
.iconpick{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-bottom:12px;}
.iconpick button{aspect-ratio:1;border:1px solid var(--line);background:var(--bg);border-radius:10px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.iconpick button.on{border-color:var(--accent);background:#2fe0b016;}
.catpick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px;}
.catpick button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:inherit;font-size:10.5px;color:var(--muted);}
.catpick button .e{font-size:20px;}
.catpick button.on{border-color:var(--accent);color:var(--text);background:#2fe0b012;}
.link-btn{color:var(--emerald);background:none;border:none;font-family:inherit;font-size:13.5px;cursor:pointer;padding:0;}
</style>

const fmtClock=(ms)=>{const s=Math.max(0,Math.floor(ms/1000));const h=String(Math.floor(s/3600)).padStart(2,'0');const m=String(Math.floor(s%3600/60)).padStart(2,'0');const ss=String(s%60).padStart(2,'0');return h+':'+m+':'+ss;};
const fmtDate=(x)=>new Date(x).toLocaleString(loc(),{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const vehicleById=(id)=>S.vehicles.find(v=>v.id===id)||null;

const activeSession=()=>S.sessions.filter(s=>s.vehicleId===S.activeVehicleId&&!s.closedAt).sort((a,b)=>b.startedAt-a.startedAt)[0]||null;
const tripsOf=(sid)=>S.trips.filter(x=>x.sessionId===sid).sort((a,b)=>a.startedAt-b.startedAt);
const distOf=(sid)=>tripsOf(sid).reduce((a,x)=>a+(+x.distanceKm||0),0);
function vehAvatar(v,size){if(v&&v.img)return '<img src="'+esc(v.img)+'" alt="">';return '<span style="font-size:'+(size||'20px')+'">'+(v&&v.icon?v.icon:'🚗')+'</span>';}

function mDir(p){const a=p.filter(Boolean).map(encodeURIComponent);if(a.length<2)return a.length?mSearch(p.filter(Boolean)[0]):null;return 'https://www.google.com/maps/dir/'+a.join('/');}
function sessionPlaces(s){const a=[];if(s.fillLocation)a.push(s.fillLocation);tripsOf(s.id).forEach(x=>{(x.waypoints||[]).forEach(w=>{if(w.name)a.push(w.name);});if(x.endLocation)a.push(x.endLocation);});return a;}
function recentPlaces(){const set=new Set();S.sessions.forEach(s=>{if(s.fillLocation)set.add(s.fillLocation);});S.trips.forEach(x=>{if(x.startLocation)set.add(x.startLocation);if(x.endLocation)set.add(x.endLocation);(x.waypoints||[]).forEach(w=>{if(w.name)set.add(w.name);});});return [...set].slice(0,40);}
function datalist(id){return '<datalist id="'+id+'">'+recentPlaces().map(p=>'<option value="'+esc(p)+'"></option>').join('')+'</datalist>';}
function sessStats(s){const tr=tripsOf(s.id);const dist=tr.reduce((a,x)=>a+(+x.distanceKm||0),0);const time=tr.reduce((a,x)=>a+(x.movingMs||(x.endedAt-x.startedAt)),0);let eff=null,unit='',perKm=null;if(s.type==='ev'){if(s.kwh>0){eff=dist/s.kwh;unit='km/kWh';}}else{if(s.liters>0){eff=dist/s.liters;unit='km/L';}}if(s.cost>0&&dist>0)perKm=s.cost/dist;return {dist,time,eff,unit,perKm,count:tr.length};}
function monthStats(){const d=new Date(),m=d.getMonth(),y=d.getFullYear();const tr=S.trips.filter(x=>{const z=new Date(x.startedAt);return z.getMonth()===m&&z.getFullYear()===y;});const km=tr.reduce((a,x)=>a+(+x.distanceKm||0),0);const fuel=S.sessions.filter(s=>{const z=new Date(s.startedAt);return z.getMonth()===m&&z.getFullYear()===y;}).reduce((a,s)=>a+(+s.cost||0),0);const extra=tr.reduce((a,x)=>a+(+x.extraCost||0)+(+x.tollCost||0),0);return {km,cost:fuel+extra,count:tr.length};}
function currentOdo(v){const base=+v.odoBase||0;return base+S.trips.filter(x=>x.vehicleId===v.id).reduce((a,x)=>a+(+x.distanceKm||0),0);}
function daysUntil(s){return Math.ceil((new Date(s+'T23:59:59').getTime()-Date.now())/86400000);}
function vehReminders(v){if(!v)return [];const out=[];const odo=currentOdo(v);
  if(v.serviceDate){const d=daysUntil(v.serviceDate);if(d<=30)out.push({k:'rem_service',over:d<0,detail:d<0?(t('rem_overdue')+' '+(-d)+' '+t('rem_days')):(t('rem_in')+' '+d+' '+t('rem_days'))});}
  if(v.serviceKm){const left=(+v.serviceKm)-odo;if(left<=1000)out.push({k:'rem_service',over:left<0,detail:(left<0?t('rem_overdue'):t('rem_in')+' '+fmtKm(left)+' km')+' · @'+fmtKm(v.serviceKm)+' km'});}
  if(v.taxDate){const d=daysUntil(v.taxDate);if(d<=30)out.push({k:'rem_tax',over:d<0,detail:d<0?(t('rem_overdue')+' '+(-d)+' '+t('rem_days')):(t('rem_in')+' '+d+' '+t('rem_days'))});}
  return out;}
function nowLocalInput(ts){const d=ts?new Date(ts):new Date();const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes());}
function vehSessionsClosed(vid){return S.sessions.filter(s=>s.vehicleId===vid&&s.closedAt).map(s=>({s,st:sessStats(s)}));}

function barChart(data,fmt){if(!data.length)return '';const max=Math.max(...data.map(d=>d.value),0.0001);const W=data.length*44,H=120,bw=26;let bars='';data.forEach((d,i)=>{const h=Math.max(3,Math.round(d.value/max*86));const x=i*44+9,y=H-20-h;bars+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+h+'" rx="5" fill="'+(d.color||'var(--emerald)')+'"/>'+'<text x="'+(x+bw/2)+'" y="'+(y-5)+'" text-anchor="middle" font-size="10" fill="var(--text)" font-family="JetBrains Mono">'+fmt(d.value)+'</text>'+'<text x="'+(x+bw/2)+'" y="'+(H-6)+'" text-anchor="middle" font-size="9.5" fill="var(--muted)">'+esc(d.label)+'</text>';});return '<div style="overflow-x:auto"><svg width="'+Math.max(W,280)+'" height="'+H+'" viewBox="0 0 '+Math.max(W,280)+' '+H+'">'+bars+'</svg></div>';}
function trTimes(r){const now=Date.now();const total=now-r.startedAt;const paused=(r.pausedMs||0)+(r.pausedSince?now-r.pausedSince:0);return {total,paused,moving:total-paused};}

/* ===================== GPS ===================== */
function haversine(a,b){const R=6371000,toR=Math.PI/180;const dLat=(b.lat-a.lat)*toR,dLon=(b.lng-a.lng)*toR;const la1=a.lat*toR,la2=b.lat*toR;const h=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function startGps(){
  if(gpsWatch!=null||!S.runningTrip)return;
  if(!('geolocation' in navigator)){S.runningTrip.gpsErr='na';render();return;}
  S.runningTrip._last=null;
  try{gpsWatch=navigator.geolocation.watchPosition((pos)=>{
    const r=S.runningTrip;if(!r)return;
    if(r.pausedSince){r._last=null;return;}
    const acc=pos.coords.accuracy,cur={lat:pos.coords.latitude,lng:pos.coords.longitude};
    if(acc!=null&&acc>50)return;
    if(r._last){const d=haversine(r._last,cur);if(d>=4&&d<=300){r.gpsKm=(r.gpsKm||0)+d/1000;save();}}
    r._last=cur;
  },(err)=>{const r=S.runningTrip;if(r){r.gpsErr=err.code===1?'denied':'err';render();}},{enableHighAccuracy:true,maximumAge:2000,timeout:12000});}catch(e){}
}
function stopGps(){if(gpsWatch!=null){try{navigator.geolocation.clearWatch(gpsWatch);}catch(e){}gpsWatch=null;}}

/* ===================== dial ===================== */
function dial(value,max,accent,sub){
  const R=92,C=2*Math.PI*R,SW=0.72;const frac=max?Math.min(value/max,1):(value>0?0.06:0);
  const over=max&&value>max,warn=max&&value/max>=0.85;const col=over?'var(--danger)':(warn?'var(--gold)':accent);
  return '<div class="dial"><svg width="236" height="236" viewBox="0 0 236 236"><g transform="rotate(133.2 118 118)">'+
    '<circle cx="118" cy="118" r="'+R+'" fill="none" stroke="#1c3327" stroke-width="15" stroke-linecap="round" stroke-dasharray="'+(SW*C)+' '+C+'"/>'+
    '<circle cx="118" cy="118" r="'+R+'" fill="none" stroke="'+col+'" stroke-width="15" stroke-linecap="round" stroke-dasharray="'+(frac*SW*C)+' '+C+'" style="transition:stroke-dasharray .5s"/>'+
    '</g></svg><div class="center"><div class="big mono">'+fmtKm(value)+'</div><div class="unit">KM</div>'+(sub?'<div class="sub">'+sub+'</div>':'')+'</div></div>';
}

  const dist=sess?distOf(sess.id):0,remain=v.estRange?Math.max(v.estRange-dist,0):null,warn=v.estRange&&dist/v.estRange>=0.85;

  else sub=sess?t('session_running'):t(ev?'hint_charge':'hint_fill');

    ctrl='<div class="card" style="margin-top:12px">'+
      (paused?'<div style="text-align:center"><span class="paused-flag">'+I.pause+' '+t('stopped')+(r.waypoints.length?' '+t('at')+' '+esc(r.waypoints[r.waypoints.length-1].name||catLabel(r.waypoints[r.waypoints.length-1].cat)):'')+'</span></div>':'')+
      '<div class="timer"><div class="lbl">'+t('drive_time')+'</div><div class="t mono" id="tMove" style="color:'+acc+'">'+fmtClock(tt.moving)+'</div>'+

      '<div class="btn-row">'+(paused?'<button class="btn btn-go btn-sm" data-act="resume">'+I.play+' '+t('resume')+'</button>':'<button class="btn btn-warn btn-sm" data-act="pause">'+I.pin+' '+t('make_stop')+'</button>')+
      '<button class="btn btn-ghost btn-sm" data-act="toll" style="color:var(--gold)">'+I.toll+' '+t('log_toll')+'</button></div>'+
      '<button class="btn btn-stop btn-sm" style="margin-top:10px" data-act="end">'+I.stop+' '+t('finish')+'</button></div>';
  }else{
    ctrl='<div class="card" style="margin-top:12px"><button class="btn btn-go" data-act="start">'+I.play+' '+t('start_driving')+'</button>'+
      '<div class="btn-row"><button class="btn btn-ghost btn-sm" data-act="fill">'+(ev?I.zap:I.fuel)+' '+t(ev?'log_charge':'log_fuel')+'</button></div></div>';

    '<div style="text-align:center;color:var(--muted);font-size:11.5px;margin-top:12px" class="mono">'+t('odometer')+' '+fmtKm(odo)+' km</div>';
}

    tr.forEach((x,ti)=>{(x.waypoints||[]).forEach(w=>{const dur=w.resumedAt?w.resumedAt-w.at:0;route+='<div class="node"><div class="rail"><div class="marker stop">'+catEmoji(w.cat)+'</div><div class="line"></div></div><div class="body"><div class="place"><a href="'+mSearch(w.name||catLabel(w.cat))+'" target="_blank" rel="noopener">'+esc(w.name||catLabel(w.cat))+'</a></div><div class="meta">'+t('stopover')+' · '+catLabel(w.cat)+(dur?' · '+fmtDur(dur):'')+(w.note?' · '+esc(w.note):'')+'</div></div></div>';});
      const isLast=ti===tr.length-1;route+='<div class="node"><div class="rail"><div class="marker'+(isLast?' dest':'')+'">'+I.pin+'</div>'+(isLast?'':'<div class="line"></div>')+'</div><div class="body"><div class="place"><a href="'+mSearch(x.endLocation||'')+'" target="_blank" rel="noopener">'+esc(x.endLocation||t('destination'))+'</a></div><div class="leg mono" style="color:'+ac+'">'+fmtKm(x.distanceKm)+' km · '+fmtDur(x.movingMs||(x.endedAt-x.startedAt))+(x.tollCost?' · '+t('toll').toLowerCase()+' '+fmtRp(x.tollCost):'')+'</div></div></div>';});

function viewStats(){
  const v=activeVehicle();
  if(!v)return '<div class="empty"><div class="ico">📊</div><p>'+t('pick_vehicle')+'</p></div>';
  const ev=isEV(v),acc=accentOf(v);
  const allKm=S.trips.reduce((a,x)=>a+(+x.distanceKm||0),0);
  const allCost=S.sessions.reduce((a,s)=>a+(+s.cost||0),0)+S.trips.reduce((a,x)=>a+(+x.extraCost||0)+(+x.tollCost||0),0);
  const allTime=S.trips.reduce((a,x)=>a+(x.movingMs||(x.endedAt-x.startedAt)),0);
  const lifetime='<div class="section-t">'+t('st_lifetime')+'</div><div class="stats"><div class="stat"><div class="v mono">'+fmtKm(allKm)+'</div><div class="k">'+t('km')+'</div></div>'+
    '<div class="stat"><div class="v mono" style="font-size:14px">'+fmtRp(allCost)+'</div><div class="k">'+t('cost')+'</div></div>'+
    '<div class="stat"><div class="v mono">'+fmtDur(allTime)+'</div><div class="k">'+t('st_time')+'</div></div></div>';

  const el=effList(v.id);const unit=ev?'km/kWh':'km/L';
  const avgEff=el.length?el.reduce((a,o)=>a+o.st.eff,0)/el.length:null;
  const best=el.length?Math.max(...el.map(o=>o.st.eff)):null;
  const worst=el.length?Math.min(...el.map(o=>o.st.eff)):null;
  const rr=realRange(v.id);

  let cards='<div class="section-t">'+esc(v.brand+' '+v.model)+'</div>';
  if(rr||avgEff){
    cards+='<div class="card"><div style="display:flex;gap:12px">';
    if(rr)cards+='<div style="flex:1"><div class="mono" style="font-size:24px;font-weight:700;color:'+acc+'">'+fmtKm(rr)+' <span style="font-size:12px;color:var(--muted)">km</span></div><div style="font-size:11px;color:var(--muted);margin-top:3px">'+t('st_realrange')+(v.estRange?' · '+t('st_claimed')+' '+fmtKm(v.estRange):'')+'</div><div style="font-size:10.5px;color:var(--muted)">'+t('st_realrange_sub')+'</div></div>';
    if(avgEff)cards+='<div style="flex:1"><div class="mono" style="font-size:24px;font-weight:700;color:'+acc+'">'+fmtKm(avgEff)+'</div><div style="font-size:11px;color:var(--muted);margin-top:3px">'+t('st_avg_eff')+' ('+unit+')</div>'+(best?'<div style="font-size:10.5px;color:var(--muted)">'+t('st_best')+' '+fmtKm(best)+' · '+t('st_worst')+' '+fmtKm(worst)+'</div>':'')+'</div>';
    cards+='</div></div>';
  }
  // real consumption from range-start/range-end logging
  const rc=S.trips.filter(x=>x.vehicleId===v.id&&x.rangeStart!=null&&x.rangeEnd!=null&&x.rangeStart>x.rangeEnd&&(+x.distanceKm||0)>0);
  if(rc.length){const drop=rc.reduce((a,x)=>a+(x.rangeStart-x.rangeEnd),0);const km=rc.reduce((a,x)=>a+(+x.distanceKm||0),0);const u=rc[0].rangeUnit||'km';
    const ratio=km/drop; // km driven per 1 unit of range used
    cards+='<div class="card" style="margin-top:12px"><div class="mono" style="font-size:24px;font-weight:700;color:'+acc+'">'+fmtKm(ratio)+' <span style="font-size:12px;color:var(--muted)">km / 1'+u+'</span></div><div style="font-size:11px;color:var(--muted);margin-top:3px">'+t('st_consumption')+' · '+fmtKm(km)+' km '+t('used_per')+' '+fmtKm(drop)+u+'</div><div style="font-size:10.5px;color:var(--muted)">'+t('st_consumption_sub')+'</div></div>';}

  // efficiency trend (last 8 sessions with eff)
  let trend='';
  if(el.length){const data=el.slice(-8).map(o=>({label:new Date(o.s.startedAt).toLocaleDateString(loc(),{day:'numeric',month:'short'}),value:o.st.eff,color:acc}));
    trend='<div class="section-t">'+t('st_eff_trend')+' ('+unit+')</div><div class="card">'+barChart(data,(x)=>fmtKm(x))+'</div>';}

  // monthly cost (last 6 months)
  const now=new Date();const months=[];
  for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);const m=d.getMonth(),y=d.getFullYear();
    const fuel=S.sessions.filter(s=>{const z=new Date(s.startedAt);return z.getMonth()===m&&z.getFullYear()===y;}).reduce((a,s)=>a+(+s.cost||0),0);
    const extra=S.trips.filter(x=>{const z=new Date(x.startedAt);return z.getMonth()===m&&z.getFullYear()===y;}).reduce((a,x)=>a+(+x.extraCost||0)+(+x.tollCost||0),0);
    months.push({label:d.toLocaleDateString(loc(),{month:'short'}),value:fuel+extra,color:'var(--leaf)'});}
  let costc='';
  if(months.some(m=>m.value>0))costc='<div class="section-t">'+t('st_month_cost')+'</div><div class="card">'+barChart(months,(x)=>x>=1000?Math.round(x/1000)+'k':Math.round(x))+'</div>';

  if(!rr&&!avgEff&&!el.length&&allKm===0)return '<div style="margin-top:6px">'+lifetime+'</div><div class="empty"><div class="ico">📈</div><p>'+t('st_none')+'</p></div>';
  return lifetime+cards+trend+costc;
}

  const tb=document.querySelectorAll('#mType button');tb.forEach(b=>b.onclick=()=>{type=b.dataset.t;tb.forEach(x=>x.className=x.dataset.t==='ev'?(type==='ev'?'on-ev':''):(type==='ice'?'on-ice':''));document.getElementById('mRangeL').textContent=t(type==='ev'?'v_range_ev':'v_range_ice');});
  document.querySelectorAll('#mIcons button').forEach(b=>b.onclick=()=>{icon=b.dataset.e;document.querySelectorAll('#mIcons button').forEach(x=>x.classList.toggle('on',x.dataset.e===icon));});
  document.getElementById('mSave').onclick=()=>{const brand=document.getElementById('mBrand').value.trim(),model=document.getElementById('mModel').value.trim();if(!brand&&!model)return;const obj={type,brand,model,estRange:num(document.getElementById('mRange').value)||null,icon,img:document.getElementById('mImg').value.trim()||null,odoBase:num(document.getElementById('mOdo').value)||null,serviceKm:num(document.getElementById('mSvcKm').value)||null,serviceDate:document.getElementById('mSvcDate').value||null,taxDate:document.getElementById('mTaxDate').value||null};if(cur)Object.assign(cur,obj);else{const nv=Object.assign({id:uid()},obj);S.vehicles.push(nv);if(!S.activeVehicleId)S.activeVehicleId=nv.id;}save();closeModal();render();};
}
function modalFill(){
  const v=activeVehicle();if(!v)return;const ev=v.type==='ev';
  sheet(t(ev?'f_charge':'f_fill'),
    '<div class="field"><label>'+t('f_date')+'</label><input id="fDate" type="datetime-local" value="'+nowLocalInput()+'"></div>'+
    '<div class="field"><label>'+t('f_loc')+'</label><input id="fLoc" list="dlp" placeholder="'+(ev?'SPKLU Senayan City':'SPBU Shell Antasari')+'">'+datalist('dlp')+'</div>'+
    (ev?'<div class="row2"><div class="field mono"><label>'+t('f_kwh')+'</label><input id="fKwh" inputmode="decimal" placeholder="32"></div><div class="field mono"><label>'+t('f_pct')+'</label><input id="fPct" inputmode="decimal" placeholder="80"></div></div>':'<div class="field mono"><label>'+t('f_liter')+'</label><input id="fLit" inputmode="decimal" placeholder="40"></div>')+
    '<div class="field mono"><label>'+t('f_cost')+'</label><input id="fCost" inputmode="numeric" placeholder="'+(ev?'80000':'500000')+'"></div><p class="hint">'+t(ev?'f_hint_ev':'f_hint_ice')+'</p><button class="btn btn-go" id="fSave">'+t('f_start')+'</button>');
  document.getElementById('fSave').onclick=()=>{const dv=document.getElementById('fDate').value;const when=dv?new Date(dv).getTime():Date.now();const open=S.sessions.find(s=>s.vehicleId===v.id&&!s.closedAt);if(open)open.closedAt=Math.min(when,Date.now())>open.startedAt?when:Date.now();const ns={id:uid(),vehicleId:v.id,type:v.type,fillLocation:document.getElementById('fLoc').value.trim(),startedAt:when,closedAt:null,kwh:ev?num(document.getElementById('fKwh').value)||null:null,percent:ev?num(document.getElementById('fPct').value)||null:null,liters:!ev?num(document.getElementById('fLit').value)||null:null,cost:num(document.getElementById('fCost').value)||null};S.sessions.push(ns);save();closeModal();S.tab='sessions';render();};
}
function modalStart(){
  const v=activeVehicle();if(!v)return;const sess=activeSession();let def='';if(sess){const lt=tripsOf(sess.id).slice(-1)[0];def=lt?lt.endLocation:sess.fillLocation||'';}
  const ev=v.type==='ev',rUnit=ev?'%':'km';
  sheet(t('s_title'),'<div class="field"><label>'+t('s_from')+'</label><input id="sLoc" list="dlp" value="'+esc(def)+'" placeholder="Rumah">'+datalist('dlp')+'</div>'+
    '<div class="field mono"><label>'+t('s_range')+' ('+rUnit+')</label><input id="sRange" inputmode="decimal" placeholder="'+(ev?'72':(v.estRange?Math.round(v.estRange*0.6):'280'))+'"></div>'+
    '<p class="hint">'+t('s_range_hint')+'</p><p class="hint" style="margin-top:-8px">'+t('s_hint')+'</p><button class="btn btn-go" id="sSave">'+I.play+' '+t('s_go')+'</button>');
  document.getElementById('sSave').onclick=()=>{let sid=S.sessions.find(s=>s.vehicleId===v.id&&!s.closedAt)?.id;const lc=document.getElementById('sLoc').value.trim();if(!sid){sid=uid();S.sessions.push({id:sid,vehicleId:v.id,type:v.type,fillLocation:lc,startedAt:Date.now(),closedAt:null,cost:null,kwh:null,percent:null,liters:null,auto:true});}S.runningTrip={sessionId:sid,vehicleId:v.id,startLocation:lc,startedAt:Date.now(),pausedMs:0,pausedSince:null,waypoints:[],gpsKm:0,tolls:[],rangeStart:num(document.getElementById('sRange').value),rangeUnit:rUnit};save();closeModal();S.tab='home';render();if(S.settings.gps)startGps();};
}
function modalPause(){
  let cat='other';
  sheet(t('mp_title'),
    '<div class="field"><label>'+t('mp_where')+'</label><input id="pLoc" list="dlp" placeholder="Rest area KM 57" autofocus>'+datalist('dlp')+'</div>'+
    '<div class="field"><label>'+t('mp_type')+'</label><div class="catpick" id="pCat">'+CATS.map(c=>'<button data-c="'+c[0]+'" class="'+(c[0]===cat?'on':'')+'"><span class="e">'+c[1]+'</span>'+(lang==='id'?c[2]:c[3])+'</button>').join('')+'</div></div>'+
    '<div class="field"><label>'+t('mp_note')+'</label><input id="pNote" placeholder=""></div><p class="hint">'+t('mp_hint')+'</p><button class="btn btn-warn" id="pSave">'+I.pin+' '+t('mp_btn')+'</button>');
  document.querySelectorAll('#pCat button').forEach(b=>b.onclick=()=>{cat=b.dataset.c;document.querySelectorAll('#pCat button').forEach(x=>x.classList.toggle('on',x.dataset.c===cat));});
  document.getElementById('pSave').onclick=()=>{const r=S.runningTrip;if(!r||r.pausedSince)return closeModal();r.pausedSince=Date.now();r._last=null;r.waypoints.push({name:document.getElementById('pLoc').value.trim(),cat,note:document.getElementById('pNote').value.trim(),at:Date.now(),resumedAt:null});save();closeModal();render();};
}
function modalToll(){
  const r=S.runningTrip;if(!r)return;if(!r.tolls)r.tolls=[];
  const listHtml=r.tolls.length?'<div class="chips" style="margin:-4px 0 14px">'+r.tolls.map((x,i)=>'<span class="chip" data-act="del-toll" data-i="'+i+'" style="cursor:pointer;color:var(--gold)">'+I.toll+' '+esc(x.name||t('toll'))+' <b>'+fmtRp(x.amount).replace('Rp ','')+'</b> '+I.x+'</span>').join('')+'</div>':'';
  sheet(t('log_toll'),listHtml+
    '<div class="field"><label>'+t('toll_gate')+'</label><input id="tGate" list="dlp" placeholder="GT Cibubur 2">'+datalist('dlp')+'</div>'+
    '<div class="field mono"><label>'+t('toll_amount')+'</label><input id="tAmt" inputmode="numeric" placeholder="15000" autofocus></div>'+
    '<p class="hint">'+t('toll_hint')+'</p><button class="btn btn-warn" id="tSave">'+I.toll+' '+t('toll_save')+'</button>');
  document.getElementById('tSave').onclick=()=>{const amt=num(document.getElementById('tAmt').value);if(!(amt>0)){alert(t('no_amount'));return;}r.tolls.push({name:document.getElementById('tGate').value.trim(),amount:amt,at:Date.now()});save();closeModal();render();};
}
function modalEnd(){
  const r=S.runningTrip;if(!r)return;const tt=trTimes(r);const gk=r.gpsKm?Math.round(r.gpsKm*10)/10:'';const rUnit=r.rangeUnit||'km';const tollSum=(r.tolls||[]).reduce((a,x)=>a+(+x.amount||0),0);
  sheet(t('e_title'),
    '<p class="hint" style="margin-top:0">'+t('drive_time')+': <b class="mono" style="color:var(--text)">'+fmtDur(tt.moving)+'</b> · '+t('total')+' '+fmtDur(tt.total)+(r.waypoints.length?' · '+r.waypoints.length+' '+t('stops'):'')+'</p>'+
    '<div class="field"><label>'+t('e_dest')+'</label><input id="eLoc" list="dlp" placeholder="Kantor">'+datalist('dlp')+'</div>'+
    '<div class="row2"><div class="field mono"><label>'+t('e_dist')+'</label><input id="eDist" inputmode="decimal" value="'+gk+'" placeholder="12,4"></div>'+
    '<div class="field"><label>'+t('e_purpose')+'</label><select id="ePur"><option value="">—</option><option>'+t('pur_personal')+'</option><option>'+t('pur_work')+'</option><option>'+t('pur_kos')+'</option></select></div></div>'+
    (gk?'<p class="hint" style="margin-top:-2px">'+t('e_gps')+'</p>':'')+
    (r.rangeStart?'<div class="field mono"><label>'+t('e_range')+' ('+rUnit+') — '+t('s_range').toLowerCase()+' '+fmtKm(r.rangeStart)+'</label><input id="eRange" inputmode="decimal" placeholder="'+Math.max(0,Math.round(r.rangeStart*0.7))+'"></div>':'')+
    '<div class="row2"><div class="field mono"><label>'+t('e_toll')+'</label><input id="eToll" inputmode="numeric" value="'+(tollSum||'')+'"></div>'+
    '<div class="field mono"><label>'+t('e_extra')+'</label><input id="eExtra" inputmode="numeric" placeholder="0"></div></div>'+
    '<button class="btn btn-go" id="eSave">'+I.stop+' '+t('e_save')+'</button>');
  document.getElementById('eSave').onclick=()=>{const d=num(document.getElementById('eDist').value);if(!(d>=0))return;const rr=S.runningTrip,end=Date.now();let pausedMs=rr.pausedMs||0;if(rr.pausedSince){pausedMs+=end-rr.pausedSince;const w=rr.waypoints[rr.waypoints.length-1];if(w&&!w.resumedAt)w.resumedAt=end;}const movingMs=(end-rr.startedAt)-pausedMs;const re=document.getElementById('eRange');S.trips.push({id:uid(),sessionId:rr.sessionId,vehicleId:rr.vehicleId,startLocation:rr.startLocation,endLocation:document.getElementById('eLoc').value.trim(),startedAt:rr.startedAt,endedAt:end,distanceKm:d,movingMs,pausedMs,waypoints:rr.waypoints||[],tolls:rr.tolls||[],tollCost:num(document.getElementById('eToll').value)||null,purpose:document.getElementById('ePur').value||null,extraCost:num(document.getElementById('eExtra').value)||null,rangeStart:rr.rangeStart||null,rangeEnd:re?(num(re.value)):null,rangeUnit:rr.rangeUnit||null});stopGps();S.runningTrip=null;save();closeModal();S.tab='sessions';render();};
}
function modalSettings(){
  const nV=S.vehicles.length,nT=S.trips.length,nS=S.sessions.length;
  sheet(t('set_title'),
    '<div class="chips" style="margin:0 0 16px"><span class="chip">🚗 <b>'+nV+'</b> '+t('cars')+'</span><span class="chip">'+I.route+' <b>'+nT+'</b> '+t('trips')+'</span><span class="chip">⛽ <b>'+nS+'</b> '+t('sessions').toLowerCase()+'</span></div>'+
    '<div class="field"><label>'+t('set_lang')+'</label><div class="seg" id="sLang"><button data-l="id" class="'+(lang==='id'?'on':'')+'">🇮🇩 Indonesia</button><button data-l="en" class="'+(lang==='en'?'on':'')+'">🇬🇧 English</button></div></div>'+
    '<div class="field"><label>'+t('set_gps')+'</label><div class="seg" id="sGps"><button data-g="1" class="'+(S.settings.gps?'on':'')+'">'+I.nav+' '+(lang==='id'?'Nyala':'On')+'</button><button data-g="0" class="'+(!S.settings.gps?'on':'')+'">'+(lang==='id'?'Mati':'Off')+'</button></div><p class="hint" style="margin-top:8px">'+t('set_gps_hint')+'</p></div>'+
    '<button class="btn btn-ghost btn-sm" style="margin-bottom:10px" data-act="export-csv">⬇ '+t('set_csv')+'</button>'+
    '<button class="btn btn-ghost btn-sm" style="margin-bottom:10px" data-act="export-json">💾 '+t('set_backup')+'</button>'+
    '<button class="btn btn-ghost btn-sm" style="margin-bottom:16px" data-act="import-json">📂 '+t('set_restore')+'</button>'+
    '<button class="btn btn-stop btn-sm" data-act="wipe">'+t('set_wipe')+'</button><p class="hint" style="margin-top:14px">'+t('set_hint')+'</p>');
  document.querySelectorAll('#sLang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;S.settings.lang=lang;save();closeModal();render();modalSettings();});
  document.querySelectorAll('#sGps button').forEach(b=>b.onclick=()=>{const on=b.dataset.g==='1';S.settings.gps=on;save();if(on&&S.runningTrip)startGps();if(!on)stopGps();closeModal();render();modalSettings();});
}

/* ===================== export / import ===================== */
function download(name,text,type){const b=new Blob([text],{type});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
function exportCSV(){const rows=[['date','vehicle','type','from','to','distance_km','drive_min','total_min','stops','purpose','toll_rp','parking_rp','fill_location']];S.trips.slice().sort((a,b)=>a.startedAt-b.startedAt).forEach(x=>{const v=vehicleById(x.vehicleId),s=S.sessions.find(z=>z.id===x.sessionId),mv=x.movingMs||(x.endedAt-x.startedAt);rows.push([new Date(x.startedAt).toLocaleString('id-ID'),v?v.brand+' '+v.model:'',v?v.type:'',x.startLocation||'',x.endLocation||'',(+x.distanceKm||0),Math.round(mv/60000),Math.round((x.endedAt-x.startedAt)/60000),(x.waypoints||[]).length,x.purpose||'',(+x.tollCost||0),(+x.extraCost||0),s?s.fillLocation||'':'']);});const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');download('d-rive-trips.csv','\ufeff'+csv,'text/csv');}
function exportJSON(){download('d-rive-backup.json',JSON.stringify({vehicles:S.vehicles,sessions:S.sessions,trips:S.trips,activeVehicleId:S.activeVehicleId,settings:S.settings},null,2),'application/json');}
function importJSON(){const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=()=>{const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(d.vehicles)S.vehicles=d.vehicles;if(d.sessions)S.sessions=d.sessions;if(d.trips)S.trips=d.trips;if(d.activeVehicleId)S.activeVehicleId=d.activeVehicleId;if(d.settings){S.settings=d.settings;lang=S.settings.lang||lang;}S.runningTrip=null;save();closeModal();render();alert(t('restored'));}catch(e){alert(t('invalid'));}};rd.readAsText(f);};inp.click();}

/* ===================== actions ===================== */
document.addEventListener('click',(e)=>{
  const cl=e.target.closest('[data-close]');if(cl){if(cl.classList.contains('overlay')&&e.target!==cl)return;closeModal();return;}
  const el=e.target.closest('[data-act]');if(!el)return;const act=el.dataset.act,id=el.dataset.id;
  if(act==='tab'){S.tab=el.dataset.tab;render();}
  else if(act==='add-vehicle')modalVehicle(null);
  else if(act==='edit-vehicle')modalVehicle(id);
  else if(act==='set-active'){S.activeVehicleId=id;save();render();}
  else if(act==='del-vehicle'){if(confirm(t('c_del_v'))){const sids=S.sessions.filter(s=>s.vehicleId===id).map(s=>s.id);S.vehicles=S.vehicles.filter(v=>v.id!==id);S.sessions=S.sessions.filter(s=>s.vehicleId!==id);S.trips=S.trips.filter(x=>!sids.includes(x.sessionId));if(S.activeVehicleId===id)S.activeVehicleId=S.vehicles[0]?.id||null;if(S.runningTrip&&S.runningTrip.vehicleId===id){stopGps();S.runningTrip=null;}save();render();}}
  else if(act==='fill')modalFill();
  else if(act==='start')modalStart();
  else if(act==='pause')modalPause();
  else if(act==='toll')modalToll();
  else if(act==='del-toll'){const r=S.runningTrip;if(r&&r.tolls){r.tolls.splice(+el.dataset.i,1);save();modalToll();}}
  else if(act==='resume'){const r=S.runningTrip;if(r&&r.pausedSince){r.pausedMs=(r.pausedMs||0)+(Date.now()-r.pausedSince);const w=r.waypoints[r.waypoints.length-1];if(w&&!w.resumedAt)w.resumedAt=Date.now();r.pausedSince=null;r._last=null;save();render();}}
  else if(act==='end')modalEnd();
  else if(act==='del-trip'){S.trips=S.trips.filter(x=>x.id!==id);save();render();}
  else if(act==='close-session'){const s=S.sessions.find(z=>z.id===id);if(s){s.closedAt=Date.now();save();render();}}
  else if(act==='del-session'){if(confirm(t('c_del_s'))){S.sessions=S.sessions.filter(s=>s.id!==id);S.trips=S.trips.filter(x=>x.sessionId!==id);save();render();}}
  else if(act==='toggle-map')toggleMap(id);
  else if(act==='settings')modalSettings();
  else if(act==='export-csv')exportCSV();
  else if(act==='export-json')exportJSON();
  else if(act==='import-json')importJSON();
  else if(act==='wipe'){if(confirm(t('c_wipe'))){stopGps();S={vehicles:[],sessions:[],trips:[],activeVehicleId:null,runningTrip:null,tab:'home',settings:{gps:false,lang:lang}};save();closeModal();render();}}
});

if('serviceWorker' in navigator && location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
load();render();
if(S.runningTrip&&S.settings.gps)startGps();
</script>
